[tool.pytest.ini_options]
pythonpath = [".", "../execution-model", "../execution-pipeline"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
strict = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/../execution-model", "$MYPY_CONFIG_FILE_DIR/../execution-pipeline"]
