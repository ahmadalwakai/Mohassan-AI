name: CI

on:
  pull_request:
    branches: [feat/skill-engine, main]
  push:
    branches: [feat/skill-engine]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        id: chromium
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Run Vitest
        id: tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=vitest-report.xml
      - name: Upload Vitest report
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vitest-report
          path: vitest-report.xml
          if-no-files-found: error

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Gradle wrapper execution
        run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest
