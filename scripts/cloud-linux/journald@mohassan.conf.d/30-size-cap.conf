[Journal]
# Allocate 128 MiB of disk and 32 MiB of runtime storage to the API namespace on this VM.
# The cap vacuums archived journals and the active journal can cause temporary overage.
# https://manpages.ubuntu.com/manpages/noble/man5/journald.conf.5.html (retrieved 2026-11-25)
SystemMaxUse=128M
RuntimeMaxUse=32M
