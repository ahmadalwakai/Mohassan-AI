# OpenSSH sshd_config Match directives (retrieved 2026-11-25)
# https://man.openbsd.org/sshd_config#Match
Match User mohassan-backup-pull
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /var/lib/mohassan-backup-pull/.ssh/authorized_keys
    AuthorizedKeysCommand none
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    ForceCommand /usr/local/sbin/mohassan-backup-ssh-command
Match all
