<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
  <title>ربط محرك البرمجة</title>
  <style>
    body { margin: 1.5rem; font: 1rem/1.6 system-ui, sans-serif; background: #f7f8f5; color: #19231c; }
    h1 { margin: 0 0 .5rem; font-size: 1.3rem; }
    p { margin: 0 0 1rem; }
    label, input { display: block; }
    input { box-sizing: border-box; width: 100%; margin-bottom: 1rem; padding: .35rem .5rem; border: 1px solid #5b6d60; font: 1.1rem monospace; }
    button { padding: .35rem 1rem; border: 1px solid #214e36; border-radius: .35rem; background: #214e36; color: white; font: inherit; }
    button:disabled { opacity: .6; }
    #status { margin-top: .75rem; }
  </style>
</head>
<body>
  <h1>ربط محرك البرمجة بهذا الجهاز</h1>
  <p>أنشئ رمزًا من «مشاريع البرمجة» في موحسن وألصقه هنا قبل انتهاء صلاحيته.</p>
  <form id="pair">
    <label for="code">رمز الربط</label>
    <input id="code" dir="ltr" type="text" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" required autofocus>
    <button id="submit" type="submit">ربط الجهاز</button>
  </form>
  <p id="status" role="status" aria-live="polite" tabindex="-1"></p>
</body>
</html>
