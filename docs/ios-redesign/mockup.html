<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>موحسن على iPhone</title>
  <style>
    @font-face { font-family: Alexandria; src: url("../../apps/ios/Wasla/Fonts/Alexandria-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: Alexandria; src: url("../../apps/ios/Wasla/Fonts/Alexandria-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
    @font-face { font-family: Alexandria; src: url("../../apps/ios/Wasla/Fonts/Alexandria-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
    @font-face { font-family: Alexandria; src: url("../../apps/ios/Wasla/Fonts/Alexandria-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e8eae5; color: #202823; font: 16px/1.55 Alexandria, system-ui, sans-serif; }
    h1, h2, h3, h4, p, ol, ul, figure { margin: 0; }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    svg { display: block; flex: none; }
    .gallery { max-width: 1280px; margin: auto; padding-block: 54px 64px; }
    .gallery > h1 { font-size: 30px; letter-spacing: -.035em; }
    .gallery > h1, .theme > h2 { padding-inline: 18px; }
    .theme { margin-block-start: 38px; }
    .theme > h2 { font-size: 18px; margin-block-end: 14px; }
    .devices { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    figure { width: 393px; max-width: 100%; }
    figcaption { margin-block-start: 10px; padding-inline: 18px; color: #53625b; font-size: 13px; }
    .phone {
      --background: #f7f6f2;
      --panel: #eeefe9;
      --surface: #ffffff;
      --ink: #202823;
      --muted: #53625b;
      --line: #d2dcd5;
      --control-line: #78877f;
      --soft: #e8eee8;
      --accent: #216852;
      --accent-soft: #dfeee6;
      --on-accent: #ffffff;
      --alert: #a33a2c;
      --keyboard: #d1d3da;
      --key: #ffffff;
      --key-special: #aeb3bf;
      --system-ink: #131618;
      --system-shelf: #dce3db;
      color-scheme: light;
      position: relative;
      display: flex;
      flex-direction: column;
      height: 852px;
      width: 393px;
      max-width: 100%;
      overflow: hidden;
      isolation: isolate;
      background: var(--background);
      color: var(--ink);
    }
    .dark .phone {
      --background: #141816;
      --panel: #1a201d;
      --surface: #212925;
      --ink: #f2f4f0;
      --muted: #acb9b1;
      --line: #3a4a42;
      --control-line: #718379;
      --soft: #26332d;
      --accent: #72cbb0;
      --accent-soft: #23453a;
      --on-accent: #10291f;
      --alert: #ee9383;
      --keyboard: #1d1e22;
      --key: #414247;
      --key-special: #303137;
      --system-ink: #f7f7f8;
      --system-shelf: #0e120f;
      color-scheme: dark;
    }
    .status {
      direction: ltr;
      position: relative;
      display: flex;
      flex: 0 0 59px;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px 1px 30px;
      font: 650 16px/1 system-ui, sans-serif;
      color: var(--ink);
    }
    .status-icons { display: flex; gap: 5px; align-items: center; }
    .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; border-radius: 25px; background: #070807; }
    .island::after { content: ""; position: absolute; top: 14px; right: 13px; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle at 38% 45%, #232941, #10131b 62%, #0a0b0b); }
    .home { width: 136px; height: 5px; border-radius: 4px; background: var(--system-ink); position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 2; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      flex: 0 0 56px;
      padding-inline: 12px;
      border-block-end: 1px solid var(--line);
      background: var(--background);
    }
    .bar h3 { font-size: 16px; font-weight: 600; }
    .bar-group { display: flex; gap: 2px; align-items: center; }
    .bar-group:last-child { justify-content: end; }
    .icon-button {
      width: 44px;
      height: 44px;
      display: grid;
      flex-shrink: 0;
      place-items: center;
      color: var(--muted);
      background: none;
      border: 0;
      border-radius: 15px;
      padding: 0;
      position: relative;
    }
    .icon-button :is(svg, span) { position: relative; }
    .icon-button.new { color: var(--accent); }
    .icon-button.new::before, .icon-button.attach::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--accent-soft); }
    .icon-button.attach::before { background: var(--soft); }
    .bar .icon { width: 17px; height: 17px; }
    .thread {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 22px 4px;
      scrollbar-width: none;
    }
    .turns { display: flex; flex-direction: column; gap: 24px; }
    .user-turn {
      align-self: flex-start;
      padding: 10px 14px;
      max-width: 91%;
      border: 1px solid var(--line);
      border-radius: 19px 7px 19px 19px;
      background: var(--soft);
      font-size: 16px;
      line-height: 1.5;
    }
    .reply { display: flex; flex-direction: column; gap: 14px; min-width: 0; font-size: 16px; line-height: 1.55; }
    .reply h4 { font-size: 16px; font-weight: 600; }
    .table-scroll { overflow-x: auto; border-radius: 14px; outline-offset: -2px; scrollbar-width: thin; scrollbar-color: var(--control-line) transparent; }
    table { border-spacing: 0; width: max-content; text-align: start; font-size: 14px; }
    th, td { width: 128px; height: 44px; padding: 8px 12px; border-inline-end: 1px solid var(--line); border-block-end: 1px solid var(--line); background: var(--surface); text-align: start; }
    th:first-child, td:first-child { border-inline-start: 1px solid var(--line); }
    th { border-block-start: 1px solid var(--line); background: var(--accent-soft); font-weight: 600; }
    th:first-child { border-start-start-radius: 14px; }
    th:last-child { border-start-end-radius: 14px; }
    tr:last-child td:first-child { border-end-start-radius: 14px; }
    tr:last-child td:last-child { border-end-end-radius: 14px; }
    .reply ul { padding-inline-start: 17px; }
    .reply li + li { margin-block-start: 8px; }
    .reply li::marker { color: var(--accent); }
    .reply-actions { display: flex; gap: 2px; margin-block-start: -9px; }
    .reply-actions .icon { width: 16px; height: 16px; }
    .composer { padding: 8px 16px 9px; flex: 0 0 auto; }
    .compose-card {
      display: flex;
      align-items: end;
      gap: 6px;
      min-height: 58px;
      padding: 6px;
      border-radius: 24px;
      border: 1px solid var(--accent);
      background: var(--surface);
      box-shadow: 0 4px 14px #0002;
    }
    .compose-card .send { background: var(--accent); color: var(--on-accent); border-radius: 16px; }
    .draft { display: flex; flex: 1; align-items: center; min-height: 44px; color: var(--ink); font-size: 16px; padding-inline: 4px; }
    .caret { height: 20px; width: 1.7px; margin-inline-start: 1px; background: var(--accent); }
    .phone[data-screen="notification-banner"] .thread { padding-block-start: 46px; }
    .phone.idle-chat .composer { margin-block-end: 24px; }
    .phone.idle-chat .compose-card { border-color: var(--line); }
    .phone.idle-chat .send { background: var(--soft); color: var(--muted); }
    .phone.idle-chat .draft { color: var(--muted); }
    .notification-banner {
      position: absolute;
      inset: 56px 10px auto;
      z-index: 3;
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: start;
      min-height: 78px;
      padding: 13px;
      border: 1px solid color-mix(in srgb, var(--system-ink) 14%, transparent);
      border-radius: 26px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      color: var(--system-ink);
      backdrop-filter: blur(20px);
      box-shadow: 0 4px 18px #0003;
    }
    .notification-banner img { width: 36px; height: 36px; border-radius: 9px; }
    .notification-banner h4 { font-size: 14px; font-weight: 700; }
    .notification-banner p { margin-block-start: 3px; font-size: 13px; line-height: 1.6; }
    .notification-banner small { color: var(--muted); font-size: 11px; }
    .keyboard { flex: 0 0 auto; height: 276px; padding: 9px 5px 0; border-block-start: 1px solid var(--line); background: var(--keyboard); color: var(--system-ink); }
    .keyrow { display: flex; gap: 4px; direction: ltr; margin-block-end: 9px; }
    .key { flex: 1; display: grid; place-items: center; height: 41px; border-radius: 5px; background: var(--key); box-shadow: 0 1px 0 #0005; font: 400 21px/1 system-ui, sans-serif; }
    .key.special { flex: 1.55; background: var(--key-special); font-size: 16px; }
    .key.space { flex: 5; font: 400 14px/1.2 Alexandria, sans-serif; color: var(--system-ink); }
    .keyboard-footer { direction: ltr; display: flex; justify-content: space-between; padding: 2px 23px; }
    .keyboard-footer .icon { width: 20px; height: 20px; }
    .phone:is([data-screen="conversations"], [data-screen="settings"], [data-screen="notification-settings"], [data-screen="monitor-settings"]) { background: var(--system-shelf); }
    .sheet { flex: 1 1 auto; min-height: 0; overflow: hidden; border-radius: 26px 26px 0 0; background: var(--background); }
    .sheet .bar { min-height: 56px; }
    .done { min-width: 52px; min-height: 36px; margin-inline-end: 5px; padding: 5px 13px; border: 0; border-radius: 20px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 600; }
    .conversations, .settings { padding: 17px 22px 34px; }
    .conversation-list { display: grid; gap: 10px; list-style: none; padding: 0; }
    .conversation {
      display: flex;
      width: 100%;
      align-items: center;
      text-align: start;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--ink);
      background: var(--surface);
      min-height: 72px;
    }
    .tile { width: 40px; height: 40px; display: grid; flex: none; place-items: center; border-radius: 11px; color: var(--muted); background: var(--soft); }
    .conversation[aria-current="true"] { border-color: var(--accent); }
    .conversation[aria-current="true"] .tile { color: var(--accent); background: var(--accent-soft); }
    .conversation[aria-current="true"] .subtitle { color: var(--accent); }
    .conversation .text { flex: 1 1 auto; }
    .conversation .title, .settings-row .title { display: block; font-size: 14px; font-weight: 600; }
    .conversation .subtitle, .settings-row .subtitle { display: block; margin-block-start: 3px; color: var(--muted); font-size: 12px; }
    .chevron { width: 13px; height: 13px; color: var(--muted); }
    .settings { display: grid; gap: 22px; padding-block-start: 18px; }
    .settings-section h4 { color: var(--muted); margin: 0 2px 8px; font-size: 13px; font-weight: 600; }
    .settings-card { padding: 17px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
    .account-card { display: grid; gap: 14px; }
    .settings-row { display: flex; gap: 12px; align-items: center; min-height: 36px; }
    .account-divider { height: 1px; background: var(--line); }
    .settings-row .tile { width: 36px; height: 36px; border-radius: 10px; color: var(--accent); background: var(--accent-soft); }
    .settings-row .title { font-weight: 500; }
    .settings-row .tile .icon { width: 16px; height: 16px; }
    .settings-row.sign-out { min-height: 44px; }
    .settings-row.sign-out, .settings-row.sign-out .tile { color: var(--alert); }
    .settings-row.sign-out .tile { background: color-mix(in srgb, var(--alert) 10%, transparent); }
    .settings-card p { color: var(--muted); font-size: 13px; line-height: 1.7; }
    .segments { display: flex; padding: 3px; gap: 3px; background: var(--background); border-radius: 13px; }
    .segments span { display: grid; flex: 1; place-items: center; min-height: 44px; padding-inline: 4px; border: 1px solid transparent; border-radius: 10px; text-align: center; color: var(--muted); font-size: 12px; font-weight: 600; }
    .segments [aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .phone:is([data-screen="notification-settings"], [data-screen="monitor-settings"]) .sheet { display: flex; flex-direction: column; }
    .phone:is([data-screen="notification-settings"], [data-screen="monitor-settings"]) .settings { overflow-y: auto; scrollbar-width: none; }
    .notification-settings-card .settings-row { justify-content: space-between; min-height: 50px; }
    .notification-settings-card p { margin-block-start: 12px; }
    .notification-switch {
      position: relative;
      flex: none;
      width: 51px;
      min-height: 44px;
      padding: 0;
      border: 0;
      background: none;
    }
    .notification-switch::before {
      content: "";
      position: absolute;
      inset: 6px 0;
      border: 1px solid var(--control-line);
      border-radius: 20px;
      background: var(--soft);
    }
    .notification-switch::after {
      content: "";
      position: absolute;
      inset-block-start: 9px;
      inset-inline-end: 3px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 4px #0003;
    }
    .notification-switch[aria-checked="true"]::before { border-color: var(--accent); background: var(--accent); }
    .notification-switch[aria-checked="true"]::after { inset-inline-end: 22px; }
    .monitor-card {
      display: grid;
      gap: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
    }
    .monitor-heading { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .monitor-heading h4 { font-size: 16px; font-weight: 600; }
    [data-screen="monitor-conversation"] .monitor-heading h4 { font-size: 14px; }
    .monitor-heading .icon { color: var(--accent); }
    .monitor-label { display: flex; align-items: center; gap: 8px; }
    .monitor-title { font-size: 16px; font-weight: 500; }
    .monitor-facts { display: grid; gap: 9px; margin: 0; }
    .monitor-fact { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 3px 12px; }
    .monitor-fact dt { color: var(--muted); font-size: 13px; }
    .monitor-fact dd { min-width: 0; margin: 0; overflow-wrap: anywhere; font-size: 14px; font-weight: 500; }
    .monitor-observed-at { display: block; margin-block-start: 3px; color: var(--muted); font-size: 12px; }
    .monitor-actions { display: flex; gap: 8px; }
    .monitor-action {
      flex: 1;
      min-height: 48px;
      padding: 8px 10px;
      border: 1px solid var(--control-line);
      border-radius: 15px;
      background: var(--surface);
      font-size: 16px;
      font-weight: 600;
    }
    .monitor-action.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
    .monitor-action.destructive { color: var(--alert); }
    .monitor-chip {
      padding: 5px 10px;
      border-radius: 16px;
      color: var(--muted);
      background: var(--soft);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }
    .monitor-chip:is(.active, .completed) { color: var(--accent); background: var(--accent-soft); }
    .monitor-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .monitor-open {
      width: 100%;
      min-height: 44px;
      padding: 0;
      border: 0;
      background: none;
      text-align: start;
    }
    .monitor-open > .monitor-name { flex: 1; font-weight: 600; }
    @media (max-width: 1260px) { .devices { justify-content: center; } }
    @media (max-width: 450px) { .gallery { padding-block-start: 28px; } }
  </style>
</head>
<body>

    <symbol id="monitor" viewBox="0 0 24 24"><path d="M3 12h4l3-6 4 12 3-6h4"/><circle cx="12" cy="12" r="10"/></symbol>
  </svg>

  <main class="gallery">
    <h1>موحسن على iPhone</h1>
    <section class="theme dark" data-theme="dark" aria-labelledby="dark-title">
      <h2 id="dark-title">المظهر الداكن</h2>
      <div class="devices"></div>
    </section>
    <section class="theme light" data-theme="light" aria-labelledby="light-title">
      <h2 id="light-title">المظهر الفاتح</h2>
      <div class="devices"></div>
    </section>
  </main>

  <template id="status">
    <div class="status" aria-hidden="true">
      <span>9:41</span><div class="island"></div>
      <div class="status-icons">
        <svg width="19" height="14" viewBox="0 0 19 14" fill="currentColor"><rect x="0" y="9" width="3.5" height="4" rx="1"/><rect x="5" y="6" width="3.5" height="7" rx="1"/><rect x="10" y="3" width="3.5" height="10" rx="1"/><rect x="15" width="3.5" height="13" rx="1"/></svg>
        <svg width="16" height="13" viewBox="0 0 16 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 3a10 10 0 0 1 14 0M3.5 5.7a6.3 6.3 0 0 1 9 0M6 8.3a2.8 2.8 0 0 1 4 0"/><circle cx="8" cy="11" r=".6" fill="currentColor"/></svg>
        <svg width="27" height="14" viewBox="0 0 27 14" fill="currentColor"><rect x=".5" y="1.5" width="23" height="11" rx="3" opacity=".55" fill="none" stroke="currentColor"/><rect x="2.5" y="3.5" width="19" height="7" rx="1"/><path d="M25 5c2 0 2 4 0 4Z" opacity=".55"/></svg>
      </div>
    </div>
  </template>

  <template id="chat">
    <header class="bar">
      <div class="bar-group">
        <button class="icon-button" type="button" aria-label="المحادثات"><svg class="icon" aria-hidden="true"><use href="#sidebar"/></svg></button>

  <script>
    const screens = [
      ['chat', 'المحادثة', 'chat'],
      ['conversations', 'المحادثات', 'conversations'],
      ['settings', 'الإعدادات', 'settings'],
      ['notification-banner', 'إشعار اكتمال المهمة', 'chat'],
      ['notification-settings', 'إعدادات الإشعارات', 'settings'],
      ['monitor-approval', 'مقترح مراقبة', 'chat'],
      ['monitor-conversation', 'مراقبة في المحادثة', 'chat'],
      ['monitor-settings', 'المراقبات في الإعدادات', 'settings']
    ];
    for (const theme of document.querySelectorAll('[data-theme]')) {
      for (const [screen, label, template] of screens) {
        const figure = document.createElement('figure');
        const phone = document.createElement('div');
        const home = document.createElement('div');
        const caption = document.createElement('figcaption');
        phone.className = 'phone';
        phone.dataset.screen = screen;
        home.className = 'home';
        home.setAttribute('aria-hidden', 'true');
        phone.append(document.getElementById('status').content.cloneNode(true), document.getElementById(template).content.cloneNode(true), home);
        if (template === 'chat' && screen !== 'chat') {
          phone.classList.add('idle-chat');
          phone.querySelector('.keyboard').remove();
          phone.querySelector('.draft').textContent = 'اكتب رسالتك…';
          phone.querySelector('.send').disabled = true;
        }
        if (screen === 'notification-banner') {
          phone.append(document.getElementById(screen).content.cloneNode(true));
        }
        if (screen === 'monitor-approval' || screen === 'monitor-conversation') {
          phone.querySelector('.turns').replaceChildren(document.getElementById(screen).content.cloneNode(true));
        }
        if (screen === 'notification-settings' || screen === 'monitor-settings') {
          const settings = phone.querySelector('.settings');
          settings.children[1].after(document.getElementById('notification-settings').content.cloneNode(true));
          const notificationSwitch = settings.querySelector('.notification-switch');
          notificationSwitch.addEventListener('click', () => {
            const enabled = notificationSwitch.getAttribute('aria-checked') === 'false';
            notificationSwitch.setAttribute('aria-checked', String(enabled));
          });
          if (screen === 'monitor-settings') {
            settings.children[2].after(document.getElementById(screen).content.cloneNode(true));
          }
        }
        caption.textContent = label;
        figure.append(phone, caption);
        theme.querySelector('.devices').append(figure);
        const selected = phone.querySelector(`[data-choice="${theme.dataset.theme}"]`);
        if (selected) selected.setAttribute('aria-current', 'true');
      }
    }
    document.fonts.ready.then(() => {
      for (const phone of document.querySelectorAll('[data-screen="monitor-settings"]')) {
        const settings = phone.querySelector('.settings');
        const monitorSection = settings.querySelector('.monitor-list').closest('section');
        settings.scrollTop = monitorSection.offsetTop - settings.offsetTop - 18;
      }
    });
    for (const row of document.querySelectorAll('[data-keys]')) {
      const keys = row.dataset.keys.split(' ').map(letter => {
        const key = document.createElement('span');
        key.className = 'key';
        key.textContent = letter;
        return key;
      });
      row.prepend(...keys);
    }
  </script>
